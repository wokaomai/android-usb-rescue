[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "android-usb-rescue"
version = "0.1.0"
description = "Android USB reference-image control and MTP screenshot feedback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10,<13",
  "libusb-package>=1.0.30,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["build>=1,<2"]

[project.urls]
Repository = "https://github.com/wokaomai/android-usb-rescue"
Issues = "https://github.com/wokaomai/android-usb-rescue/issues"

[project.scripts]
android-usb-rescue = "android_usb_rescue.app:main"
android-usb-rescue-api = "android_usb_rescue.local_api:main"

[tool.setuptools.packages.find]
where = ["src"]
